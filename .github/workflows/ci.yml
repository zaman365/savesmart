name: SaveSmart checks
on:
  push:
    branches: ["codex/REVERSE_ENG-*"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
      - run: node scripts/http-smoke.mjs
      - name: Native browser smoke and responsive screenshots
        if: matrix.node == 24
        run: node scripts/browser-smoke.mjs
      - name: Browser review artifacts
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: savesmart-browser-review
          path: artifacts/browser/
          if-no-files-found: ignore
